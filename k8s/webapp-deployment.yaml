apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: webapp
  template:
    metadata:
      labels:
        component: webapp
    spec:
      containers:
        - name: webapp
          image: userverse/geniespeaks:v2
          # envFrom:
          #   - configMapRef:
          #     name: pdgs-config
          ports:
            - containerPort: 80

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Webapp Prod Deployment

on:
  push:
    branches:
      - master
      - integration
    paths:
      - webapp/**
  workflow_call:
    inputs:
      registry:
        description: Container Registry URI
        required: true
        type: string
    secrets:
      azure_username:
        description: azure_username to deploy in ACR
        required: true
      
      azure_password:
        description: azure_password to deploy in ACR
        required: true

      azure_publish_profile:
        description: azure_publish_profile to deploy in ACR
        required: true
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to registry
      uses: docker/login-action@v1
      with:
        registry: ${{ inputs.registry }}
        username: ${{ secrets.azure_username }}
        password: ${{ secrets.azure_password }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: geniespeaks.azurecr.io/${{ secrets.azure_username }}/webapp:${{ github.sha }}
        file: ./webapp/webapp.dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'gsfrontend'
        slot-name: 'production'
        publish-profile: ${{ secrets.azure_publish_profile }}
        images: 'geniespeaks.azurecr.io/${{ secrets.azure_username }}/webapp:${{ github.sha }}'

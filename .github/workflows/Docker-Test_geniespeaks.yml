# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - geniespeaks

on:
  push:
    branches:
      - Docker-Test
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to registry
      uses: docker/login-action@v1
      with:
        registry: https://geniespeaks.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_ea03f7a0baa047bfbea13d34064da54b }}
        password: ${{ secrets.AzureAppService_ContainerPassword_33258431eedb4086a061307071d85d6e }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: geniespeaks.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ea03f7a0baa047bfbea13d34064da54b }}/hello-express:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'geniespeaks'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_daef9229ca494eb2b6ddc1518493ad62 }}
        images: 'geniespeaks.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ea03f7a0baa047bfbea13d34064da54b }}/hello-express:${{ github.sha }}'
name: CI-CD

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  dast:
    uses: ./.github/workflows/dast_baseline_zap.yaml


  scraper_shiftleft_ng_sast:
    needs:
    - dast
    uses: ./.github/workflows/scraper_shiftleft_ng_sast.yml
    secrets: 
      SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}

  # scraper_dev_deployment:

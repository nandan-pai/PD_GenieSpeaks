# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Container image build

on:
  workflow_call:
    inputs:
      registry:
        description: Container Registry to upload image
        required: true
        type: string
      dockerfile:
        description: Dockfile to build the image
        required: true
        type: string

    secrets:
      app_name:
        description: App Name of the container in Azure
        required: true
      dockerhub_username:
        description: Dockerhub Username
        required: true
      dockerhub_password_token:
        description: Dockerhub Password Token
        required: true

  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to registry
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password_token }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ inputs.registry }}/${{ secrets.dockerhub_username }}/${{ secrets.app_name }}:${{ github.sha }}
          file: ${{ inputs.dockerfile }}
